/* Warden Aliases
 *
 * Command aliases for UnrealIRCd, like its aliases/anope.conf with the
 * services Warden adds (GroupServ and ChanFix). Copy this file to your
 * UnrealIRCd conf/aliases/ directory and replace
 *     include "aliases/anope.conf";
 * with
 *     include "aliases/warden.conf";
 * in unrealircd.conf, then /REHASH.
 *
 * If you renamed a service in Warden's configuration, rename it here too.
 */

alias nickserv { type services; }
alias ns { target nickserv; type services; }
alias chanserv { type services; }
alias cs { target chanserv; type services; }
alias memoserv { type services; spamfilter yes; }
alias ms { target memoserv; type services; spamfilter yes; }
alias operserv { type services; }
alias os { target operserv; type services; }
alias botserv { type services; }
alias bs { target botserv; type services; }
alias hostserv { type services; }
alias hs { target hostserv; type services; }
alias groupserv { type services; }
alias gs { target groupserv; type services; }
alias chanfix { type services; }
alias cf { target chanfix; type services; }

include "aliases/aliases.conf";
