---
name: Bug report
description: Report a non-security bug in Warden.
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please make sure to answer the questions properly and don't just enter the same text into every field as this will make it harder for us to fix your bug.

        If you're looking for help with setting up your services please post on [Discussions](https://github.com/TehPeGaSuS/warden/discussions) instead.

        If you're reporting a crash or other security issue please [report it privately](https://github.com/TehPeGaSuS/warden/security/advisories/new) instead.

  - type: textarea
    attributes:
      label: Description
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce the issue
    validations:
      required: true

  - type: textarea
    attributes:
      label: Describe the results you received
    validations:
      required: true

  - type: textarea
    attributes:
      label: Describe the results you expected
    validations:
      required: true

  - type: input
    attributes:
      label: Warden version
      description: |-
        The output of `warden --version`.
  - type: input
    attributes:
      label: IRCd and version
      description: |-
        e.g. UnrealIRCd 6.2.7
    validations:
      required: true
