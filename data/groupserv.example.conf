/*
 * Example configuration file for GroupServ.
 */

/*
 * First, create the service.
 */
service
{
	/*
	 * The name of the GroupServ client.
	 * If you change this value, you probably want to change the client directive in the configuration for the groupserv module too.
	 */
	nick = "GroupServ"

	/*
	 * The username of the GroupServ client.
	 */
	user = "services"

	/*
	 * The hostname of the GroupServ client.
	 */
	host = "${services.host}"

	/*
	 * The realname of the GroupServ client.
	 */
	real = "Group Service"

	/*
	 * The modes this client should use.
	 * Do not modify this unless you know what you are doing.
	 *
	 * These modes are very IRCd specific. If left commented, sane defaults
	 * are used based on what protocol module you have loaded.
	 *
	 * Note that setting this option incorrectly could potentially BREAK some, if
	 * not all, usefulness of the client. We will not support you if this client is
	 * unable to do certain things if this option is enabled.
	 */
	#modes = "+o"

	/*
	 * An optional comma separated list of channels this service should join. Outside
	 * of log channels this is not very useful, as the service will just idle in the
	 * specified channels, and will not accept any types of commands.
	 *
	 * Prefixes may be given to the channels in the form of mode characters or prefix symbols.
	 */
	#channels = "@#services,#mychan"

	/*
	 * The server alias that can be used to securely message this service. If
	 * your IRC server does not have an alias for this service you can set this
	 * to an empty string to tell users to use /msg instead.
	 *
	 * This setting is ignored when options:servicealias is disabled.
	 *
	 * Defaults to the nick of the service if not set.
	 */
	#alias = "GS"
}

/*
 * Core GroupServ module.
 *
 * Provides groups of accounts named like !staff, each with a member list and per-member
 * flags, in the style of Atheme's GroupServ.
 *
 * Groups can be put on channel access lists (ACCESS, FLAGS and the XOP commands) by name,
 * e.g. /msg ChanServ FLAGS #chan !staff +o; members with the c flag get that access.
 *
 * Services operators need the groupserv/auspex privilege to see every group and member
 * list, and groupserv/admin to set a group's VHOST (which members with +v can then take with
 * VHOST), use the ACSNOLIMIT and REGNOLIMIT settings, and register
 * past the group limit. FDROP and FFLAGS need the groupserv/fdrop and groupserv/fflags
 * command permissions.
 */
module
{
	name = "groupserv"

	/*
	 * The name of the client that should be GroupServ.
	 */
	client = "GroupServ"

	/*
	 * How many groups one account can found. 0 means no limit. Defaults to 5.
	 */
	maxgroups = 5

	/*
	 * How many members a group can have. 0 means no limit. Defaults to 100.
	 */
	maxgroupacs = 100

	/*
	 * How many open invitations a group can have at once. Defaults to 50.
	 */
	maxinvites = 50

	/*
	 * Whether founders may make their groups open, so anyone can JOIN them without an
	 * invitation. Defaults to no.
	 */
	enable_open_groups = no

	/*
	 * The flags given to people who JOIN a group that has no join flags of its own. F
	 * and b are never given this way. Defaults to none (plain membership).
	 */
	#joinflags = "+A"

	/*
	 * The most groups LIST shows. Defaults to 50.
	 */
	listmax = 50
}

command { service = "GroupServ"; name = "HELP"; command = "generic/help" }
command { service = "GroupServ"; name = "REGISTER"; command = "groupserv/register" }
command { service = "GroupServ"; name = "DROP"; command = "groupserv/drop" }
command { service = "GroupServ"; name = "FDROP"; command = "groupserv/fdrop"; permission = "groupserv/fdrop" }
command { service = "GroupServ"; name = "FLAGS"; command = "groupserv/flags" }
command { service = "GroupServ"; name = "FFLAGS"; command = "groupserv/fflags"; permission = "groupserv/fflags" }
command { service = "GroupServ"; name = "JOIN"; command = "groupserv/join" }
command { service = "GroupServ"; name = "INVITE"; command = "groupserv/invite" }
command { service = "GroupServ"; name = "INFO"; command = "groupserv/info" }
command { service = "GroupServ"; name = "LIST"; command = "groupserv/list" }
command { service = "GroupServ"; name = "LISTCHANS"; command = "groupserv/listchans" }
command { service = "GroupServ"; name = "SET"; command = "groupserv/set" }
command { service = "GroupServ"; name = "VHOST"; command = "groupserv/vhost" }

/*
 * Lets channels only admit members of a group: anyone else who joins is banned and kicked,
 * except users with access to the channel and services operators.
 */
command { service = "ChanServ"; name = "SET GROUPONLY"; command = "chanserv/set/grouponly" }
