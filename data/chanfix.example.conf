/*
 * Example configuration file for ChanFix.
 *
 * ChanFix remembers who usually has ops in *unregistered* channels and can give them
 * back when a channel loses all its ops or is taken over. Registered channels are left
 * to ChanServ. It works like Atheme's chanfix.
 */

/*
 * First, create the service.
 */
service
{
	/*
	 * The name of the ChanFix client.
	 * If you change this value, you probably want to change the client directive in the configuration for the chanfix module too.
	 */
	nick = "ChanFix"

	/*
	 * The username of the ChanFix client.
	 */
	user = "services"

	/*
	 * The hostname of the ChanFix client.
	 */
	host = "${services.host}"

	/*
	 * The realname of the ChanFix client.
	 */
	real = "Channel Fixing Service"

	/*
	 * The modes this client should use.
	 * Do not modify this unless you know what you are doing.
	 *
	 * These modes are very IRCd specific. If left commented, sane defaults
	 * are used based on what protocol module you have loaded.
	 *
	 * Note that setting this option incorrectly could potentially BREAK some, if
	 * not all, usefulness of the client. We will not support you if this client is
	 * unable to do certain things if this option is enabled.
	 */
	#modes = "+o"

	/*
	 * An optional comma separated list of channels this service should join. Outside
	 * of log channels this is not very useful, as the service will just idle in the
	 * specified channels, and will not accept any types of commands.
	 *
	 * Prefixes may be given to the channels in the form of mode characters or prefix symbols.
	 */
	#channels = "@#services,#mychan"

	/*
	 * The server alias that can be used to securely message this service. If
	 * your IRC server does not have an alias for this service you can set this
	 * to an empty string to tell users to use /msg instead.
	 *
	 * This setting is ignored when options:servicealias is disabled.
	 *
	 * Defaults to the nick of the service if not set.
	 */
	alias = "CF"
}

/*
 * Core ChanFix module.
 *
 * Every few minutes each op in each unregistered channel gains score (identified
 * users count 1.5 times as much); scores slowly fade. A fix (CHANFIX, or automatic
 * with autofix) gives ops back to the highest scorers, lowering the bar over fixtime.
 * CHANFIX also lowers the channel's TS so the IRCd removes a takeover's ops and modes.
 */
module
{
	name = "chanfix"

	/*
	 * The name of the client that should be ChanFix.
	 */
	client = "ChanFix"

	/*
	 * How often scores are gathered. At least 1m. Defaults to 5m.
	 */
	#gatherinterval = 5m

	/*
	 * How long a fix lowers the bar for, from 70% to 30% of the best score. Defaults to 1h.
	 */
	#fixtime = 1h

	/*
	 * How long an op is remembered after they were last seen with ops. Defaults to 28d.
	 */
	#retention = 28d

	/*
	 * The best score in a channel must be at least this for a fix. Defaults to 12
	 * (an hour of ops at the default gather interval).
	 */
	#minfixscore = 12

	/*
	 * Whether to fix opless channels automatically, without anyone asking. Defaults to no.
	 */
	autofix = no

	/*
	 * Whether a fix also removes +i, +l, +k and bans when nobody can be opped yet, so the
	 * usual ops can get back in. Only done during a fix. Defaults to yes.
	 */
	#clearmodes = yes

	/*
	 * Only track channels with at least this many users, to keep the database small.
	 * Defaults to 0 (all channels).
	 */
	#minusers = 3

	/*
	 * Channels matching any of these masks are never tracked or fixed. Separate
	 * the masks with commas and/or spaces.
	 */
	#exclude = "#services*, #opers"

	/*
	 * If set, people whose score is too low can't register a channel that others
	 * usually run (as in Atheme). Defaults to no.
	 */
	#restrictregister = yes

	/*
	 * The most channels LIST shows. Defaults to 50.
	 */
	#listmax = 50
}

command { service = "ChanFix"; name = "HELP"; command = "generic/help" }
command { service = "ChanFix"; name = "CHANFIX"; command = "chanfix/chanfix"; permission = "chanfix/chanfix" }
command { service = "ChanFix"; name = "SCORES"; command = "chanfix/scores"; permission = "chanfix/auspex" }
command { service = "ChanFix"; name = "INFO"; command = "chanfix/info"; permission = "chanfix/auspex" }
command { service = "ChanFix"; name = "LIST"; command = "chanfix/list"; permission = "chanfix/auspex" }
command { service = "ChanFix"; name = "MARK"; command = "chanfix/mark"; permission = "chanfix/mark" }
command { service = "ChanFix"; name = "NOFIX"; command = "chanfix/nofix"; permission = "chanfix/nofix" }
